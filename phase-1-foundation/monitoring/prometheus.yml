global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'ecommerce-prometheus'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'kafka'
    static_configs:
      - targets:
          - 'kafka-broker-1:9092'
          - 'kafka-broker-2:9092'
          - 'kafka-broker-3:9092'

  - job_name: 'golang-services'
    static_configs:
      - targets:
          - 'localhost:8081'
          - 'localhost:8082'
          - 'localhost:8083'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
